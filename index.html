<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SaveTogether - Uganda Savings</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-purple-600 to-green-500 min-h-screen p-4">
<div class="max-w-md mx-auto bg-white rounded-3xl shadow-2xl p-6 mt-10">
<h1 class="text-3xl font-bold text-center text-purple-700">💰 SaveTogether</h1>
<p class="text-center text-gray-500 mb-6">Uganda Group Savings</p>

<div class="bg-purple-50 p-4 rounded-2xl mb-4">
<p class="text-sm text-gray-600">Total Savings</p>
<h2 id="balance" class="text-3xl font-bold">UGX 0</h2>
</div>

<input id="phone" placeholder="MTN/Airtel Number 07XXXXXXXX" class="w-full p-3 border rounded-xl mb-3">
<input id="amount" type="number" placeholder="Amount UGX" class="w-full p-3 border rounded-xl mb-3">
<div class="grid grid-cols-2 gap-3">
<button onclick="save()" class="bg-purple-600 text-white p-3 rounded-xl font-bold">Deposit</button>
<button onclick="withdraw()" class="bg-green-600 text-white p-3 rounded-xl font-bold">Withdraw</button>
</div>

<div id="msg" class="mt-4 text-center text-sm"></div>

<div class="mt-6">
<h3 class="font-bold mb-2">Recent Activity</h3>
<ul id="history" class="text-sm text-gray-600"></ul>
</div>

<p class="text-center text-xs text-gray-400 mt-6">Live API: savings-app-7rr5.onrender.com</p>
</div>

<script>
const API = "https://savings-app-7rr5.onrender.com";
let total = 0;
async function save(){
 let phone=document.getElementById('phone').value;
 let amount=Number(document.getElementById('amount').value);
 if(!phone||!amount){document.getElementById('msg').innerText="Enter phone & amount"; return;}
 document.getElementById('msg').innerText="Processing MTN Mobile Money...";
 try{
  let r=await fetch(API+"/deposit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone,amount})});
  let d=await r.json();
  total+=amount;
  update();
  document.getElementById('msg').innerText="✅ Deposited UGX "+amount;
 }catch(e){total+=amount; update(); document.getElementById('msg').innerText="✅ Saved locally UGX "+amount;}
}
function withdraw(){
 let amount=Number(document.getElementById('amount').value);
 if(amount>total){document.getElementById('msg').innerText="Insufficient balance"; return;}
 total-=amount; update(); document.getElementById('msg').innerText="✅ Withdrawn UGX "+amount;
}
function update(){
 document.getElementById('balance').innerText="UGX "+total.toLocaleString();
 let li=document.createElement('li'); li.innerText=new Date().toLocaleTimeString()+" - UGX "+document.getElementById('amount').value;
 document.getElementById('history').prepend(li);
}
</script>
</body>
</html>
